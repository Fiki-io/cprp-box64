name: Compile Box64 Core (arm64-v8a)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Box64 Core (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3

      - name: Build Shared Library
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID=ON \
            -DARM64=ON \
            -DARM_DYNAREC=ON \
            -DBOX32=OFF \
            -DNOLOADADDR=ON \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          ls -la

      - name: Collect Artifacts
        run: |
          mkdir -p output/arm64-v8a
          find build -name "libbox64.so" -exec cp -v {} output/arm64-v8a/ \; || true
          ls -la output/arm64-v8a/

      - name: Upload Core Artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-arm64-v8a
          path: output/arm64-v8a/libbox64.so
